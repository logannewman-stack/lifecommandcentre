<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life Command Center</title>
  <meta name="description" content="Your daily plan, call list, check-ins and training log.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1320">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Command">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // Apply the saved appearance before the first paint so there is no flash.
    try { var t = localStorage.getItem('lcc-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <header class="top"><div class="hdr" id="hdr"><div class="min0"><div class="eyebrow">Life Command Center</div><h1>Loading your day</h1></div></div></header>
  <main class="wrap" id="app"><div class="skel"><div class="skel-line w40"></div><div class="skel-box"></div><div class="skel-box tall"></div></div></main>
  <nav class="tabs" aria-label="Sections"><div class="in-tabs" id="tabs"></div></nav>
  <button id="fab" class="fab" data-act="ask" hidden aria-label="Ask the assistant" title="Ask (a)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.4 3.5c-.6.5-1.6 0-1.6-.8z"/><path d="M8 8.5h8M8 11.5h5"/></svg><span>Ask</span></button>
  <div id="modal" hidden></div>
  <div id="toast" hidden role="status" aria-live="polite"></div>
  <noscript><div class="card empty" style="margin:16px">Life Command Center needs JavaScript turned on.</div></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
